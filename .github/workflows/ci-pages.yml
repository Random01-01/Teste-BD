name: Validate, test and publish Aura
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes' # Isolated, disposable CI database only.
          MYSQL_DATABASE: aura
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DEBUG: 'True'
      DB_ENGINE: mysql
      DB_NAME: aura
      DB_USER: root
      DB_PASSWORD: ''
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEV_DEMO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate ephemeral test secrets
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          DEMO_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$DEMO_PASSWORD"
          echo "DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
          pip install -r backend/requirements.txt
          npm ci
      - name: Django validation and tests (including real concurrency)
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --verbosity=2
          python manage.py migrate --noinput
          python manage.py seed_demo
      - name: JavaScript validation and browser tests
        run: |
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e -- --reporter=github,list
      - name: Build static frontend
        env:
          API_URL: ${{ vars.API_URL || '/api' }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: dist/
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.API_URL != ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish frontend only
        id: deployment
        uses: actions/deploy-pages@v4
