name: Windows installers
on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'installer/**'
      - 'scripts/build-windows.py'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/windows-installers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      AURA_VERSION: '0.1.0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install runtime dependencies for tests
        run: |
          python -m pip install --only-binary=:all: -r backend/requirements-windows.txt
      - name: Validate Python packaging and PowerShell scripts
        shell: pwsh
        run: |
          python -m unittest discover -s installer/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Python installer tests failed' }
          Get-ChildItem installer/windows/runtime/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Build allowlisted payloads and ZIP files
        run: python scripts/build-windows.py --version $env:AURA_VERSION
      - name: Install official MySQL 8.4 for isolated Windows smoke test
        shell: pwsh
        run: |
          # Same official artifact and SHA256 as Oracle.MySQL 8.4.9 in winget.
          $msi = Join-Path $env:RUNNER_TEMP 'mysql-8.4.9-winx64.msi'
          Invoke-WebRequest 'https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-8.4.9-winx64.msi' -OutFile $msi
          $expected = '7C3CAEDE97BB4AF923505A92E0B9C9FAB1E5074A841B632387AF7FB059AFBD1E'
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $expected) { throw 'MySQL checksum mismatch' }
          $result = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($result.ExitCode -notin @(0,3010)) { throw "MySQL install failed: $($result.ExitCode)" }
      - name: Test private MySQL and local application on Windows
        run: python installer/tests/windows_smoke.py dist/windows/payload/Complete
      - name: Compile both Windows EXE installers
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          foreach ($edition in @('Essential','Complete')) {
            $payload = (Resolve-Path "dist/windows/payload/$edition").Path
            $output = (Resolve-Path 'dist/windows').Path
            & $compiler "/DAppVersion=$env:AURA_VERSION" "/DEdition=$edition" "/DPayloadDir=$payload" "/DOutputPath=$output" installer/windows/Aura.iss
            if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed: $edition" }
          }
      - name: Verify installer extraction without interactive setup
        shell: pwsh
        run: |
          foreach ($label in @('Essencial','Completo')) {
            $target = Join-Path $env:RUNNER_TEMP "Aura Installed $label"
            $exe = (Resolve-Path "dist/windows/Aura-Setup-$label-$env:AURA_VERSION.exe").Path
            $result = Start-Process $exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "Installer failed: $label" }
            if (-not (Test-Path "$target/LEIAME.txt")) { throw 'LEIAME not installed' }
            if (-not (Test-Path "$target/backend/manage.py")) { throw 'Backend not installed' }
            if (Test-Path "$target/backend/.env") { throw 'Secret file included in installer' }
          }
          python scripts/build-windows.py --checksums-only
      - uses: actions/upload-artifact@v4
        with:
          name: aura-windows-${{ github.sha }}
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish requested Windows preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0c1b9-teste-bd'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:AURA_VERSION-windows-preview"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; immutable published assets were not replaced.'
            exit 0
          }
          $files = @(Get-ChildItem dist/windows -File | Where-Object { $_.Extension -in @('.exe','.zip','.txt') } | ForEach-Object FullName)
          if (($files | Where-Object { $_ -like '*.exe' }).Count -ne 2) { throw 'Expected two compiled EXEs' }
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --latest=false --title "Aura $env:AURA_VERSION - Instaladores Windows (previa)" --notes-file installer/windows/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; no complete public release was claimed.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release remains a draft; publish failed.' }
